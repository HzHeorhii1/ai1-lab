<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map Puzzle Game</title>
    <link rel="stylesheet" href="leaflet-1.7.1/leaflet.css" />
    <link rel="stylesheet" href="index.css" />
    <script src="leaflet-1.7.1/leaflet-src.js"></script>
    <script src="leaflet-1.7.1/leaflet-providers.js"></script>
    <script src="leaflet-1.7.1/leaflet-image.js"></script>
</head>
<body>
    <h1>Play with Map</h1>

    <!-- Карта -->
    <div id="map"></div>
    <button id="getLocation">Get Current Location</button>
    <button id="saveButton">Save Map as Puzzle</button>

    <!-- Поле для відображення збереженої карти -->
    <h2>Saved Map Preview</h2>
    <canvas id="savedMapCanvas" width="400" height="400" style="border: 1px solid black; margin-bottom: 20px;"></canvas>

    <!-- Контейнери для пазлів і зон розміщення -->
    <div id="gameContainer">
        <div id="dropzoneContainer"></div>
        <div id="puzzleContainer"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
