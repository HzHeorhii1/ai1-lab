<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prognoza pogody</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pacifico', cursive;
            background: linear-gradient(135deg, #72c2d1, #f3a683);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 3rem;
        }

        input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            width: 60%;
            max-width: 300px;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #ff7e67;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #ff5233;
        }

        #currentWeather, #forecast {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #forecast div {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Pogoda i prognoza pięciodniowa</h1>
    <input type="text" id="cityInput" placeholder="Wprowadź nazwę miasta">
    <button id="weatherButton">Pogoda</button>
    <div id="currentWeather"></div>
    <div id="forecast"></div>
    <script src="./index.js"></script>
</body>
</html>
