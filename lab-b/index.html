<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doodoo-list</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="kunteynir">
        <h1>Doo-Doo List</h1>
        <input type="text" id="search" placeholder="🔍 search" />
        <ul id="task-list" class="task-list">
            <li class="task-item" data-index="0">
                <input type="checkbox" class="task-checkbox">
                <span class="task-text" contenteditable="true">Sample Task</span>
                <input type="date" class="task-date">
                <button class="delete-task">🗑️</button>
            </li>
        </ul>
        <div class="task-inputs">
            <input type="text" id="new-task" placeholder="add new task" maxlength="255">
            <input type="date" id="task-date">
            <button id="add-task">save</button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
